<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Little by Little</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="widget.css">
</head>
<body class="widget">
  <div class="w" id="w">
    <div class="w-top" id="dragTop">
      <div class="w-date">
        <b id="wDate">11月7日</b>
        <span id="wSub">周五</span>
      </div>
      <div class="w-count"><b id="wDone">0</b><i>/</i><span id="wTotal">0</span></div>
    </div>
    <div class="w-bar"><i id="wBar"></i></div>
    <div class="w-list" id="wList"></div>
    <div class="w-spacer"></div>
    <div class="w-foot" id="wFoot">点这里打开 Little by Little</div>
  </div>
  <script src="widget.js"></script>
</body>
</html>
